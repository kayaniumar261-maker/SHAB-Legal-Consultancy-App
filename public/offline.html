<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAB Legal Consultancy FZE - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 520px);
        padding: 32px;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }

      span {
        color: #9a7825;
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0;
        font-size: 1.55rem;
      }

      p {
        margin: 0;
        color: #64748b;
        line-height: 1.65;
      }

      button {
        margin-top: 22px;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #0f172a;
        color: #ffffff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <span>Offline mode</span>
      <h1>SHAB Legal Consultancy FZE is temporarily offline</h1>
      <p>
        The app shell is available, but live case, client, hearing and payment data needs an internet connection.
        Reconnect and refresh to continue working with Supabase records.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
